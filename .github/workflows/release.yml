name: release

# Build the macOS daemon for Intel and Apple Silicon and attach both to the
# GitHub Release for the pushed tag.
#
# macOS cannot be cross-compiled from Linux: this is a Swift package that links
# AppKit / VideoToolbox / CoreAudio, so it needs a macOS runner with Xcode. That
# is also why the release assets used to be produced by hand inside a macOS
# sandbox guest — the one build path in this project that could not run in the
# Linux container. A macOS runner removes that asymmetry.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build assets for"
        required: true

permissions:
  contents: write

env:
  # Swift has no include_str!, so the shared web UI is inlined as string
  # literals into a GENERATED Swift file (see build-webui.sh). Without this step
  # the build fails on the missing Assets.swift, so it is not optional.
  WEBUI_REF: main

jobs:
  build:
    # macos-15, not macos-14: the package declares swift-tools-version 6.0 and
    # macos-14 ships Swift 5.10, which refuses to load it:
    #   error: package 'easystream-macos' is using Swift tools version 6.0.0 but
    #   the installed version is 5.10.0
    #
    # One NATIVE runner per architecture rather than `swift build --arch` on a
    # single one: a cross-arch build can only be compiled, not tested, and the
    # point of this job is that the tests actually run.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15,       arch: arm64 }
          - { runner: macos-15-intel, arch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: fetch the shared web UI
        run: ./build-webui.sh

# NOTE: no test step. This package has no test target — `swift test` exits 1 with
#   error: no tests found; create a target in the 'Tests' directory
# which is not a failing test, it is the absence of any. Adding a step that
# cannot pass is worse than not having one.
#
# The verification this workflow DOES perform is on the artifact itself: the
# build must produce a binary, and `file` must report the architecture its name
# claims, so an arm64 build can never be published as amd64 and fail later as
# "Bad CPU type".

      - name: build
        run: |
          set -euo pipefail
          swift build -c release
          bin=".build/release/easystream"
          [ -x "$bin" ] || { echo "::error::no easystream binary produced"; exit 1; }
          out="easystream-macos-${{ matrix.arch }}"
          cp "$bin" "/tmp/$out"
          chmod +x "/tmp/$out"
          file "/tmp/$out"
          ls -l "/tmp/$out"
          echo "ARTIFACT=$out" >> "$GITHUB_ENV"

      # A Mach-O must say which architecture it is; publishing an arm64 binary
      # under an amd64 name would only surface as "Bad CPU type" in the guest.
      - name: verify architecture
        run: |
          set -euo pipefail
          info="$(file -b "/tmp/$ARTIFACT")"
          echo "$info"
          case "${{ matrix.arch }}" in
            arm64) echo "$info" | grep -q arm64 || { echo "::error::not arm64"; exit 1; } ;;
            amd64) echo "$info" | grep -Eq 'x86_64|i386' || { echo "::error::not x86_64"; exit 1; } ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: /tmp/easystream-macos-*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/assets
          merge-multiple: true
      - run: ls -l /tmp/assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: /tmp/assets/easystream-macos-*
          fail_on_unmatched_files: true
          generate_release_notes: false
